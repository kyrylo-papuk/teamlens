[project]
name = "teamlens"
version = "0.1.0"
description = "Agentic delivery assistant: who works on what, across Jira and HRM"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "mcp>=2,<3", "httpx>=0.27", "pydantic-settings>=2.3", "anthropic>=2", "langgraph>=1.2",
                "a2a-sdk>=1.3,<2", "agent-framework-core>=1.26,<2", "agent-framework-anthropic==1.0.0b261112",
                "starlette>=1.0", "uvicorn>=0.30", "fastapi>=0.115", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
evals = ["deepeval>=4.3,<5"]
ml = ["setfit>=1.2,<2"]  # trains and runs the ticket triage model; without it a word list is used

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:deepeval"
