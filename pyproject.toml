[project]
name = "teamlens"
version = "0.1.0"
description = "Agentic delivery assistant: who works on what, across Jira and HRM"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "mcp>=2,<3", "httpx>=0.27", "pydantic-settings>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
