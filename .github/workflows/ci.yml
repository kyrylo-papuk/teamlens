name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      # No keys and no network: the model is scripted, Jira is in memory. The evaluation against the real
      # model is run by hand (python -m teamlens.evals run) and its results are committed under evals/results.
      - run: pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: sh scripts/smoke.sh
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
