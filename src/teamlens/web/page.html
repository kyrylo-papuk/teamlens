<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeamLens</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1c2330; --muted: #667085; --line: #e3e7ee;
    --accent: #2f5fd0; --ok: #1f9d63; --warn: #c9861a; --bad: #d1463c; --chip: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151b; --card: #1b2029; --ink: #e6e9ef; --muted: #96a0b3; --line: #2b323f;
            --accent: #7ea2ff; --ok: #4cc38a; --warn: #e2a84b; --bad: #f0766c; --chip: #262d39; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: var(--card);
           border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .2px; }
  header .src { color: var(--muted); font-size: 12px; }
  header .who { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); }
  select, textarea, button { font: inherit; color: var(--ink); }
  select { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; padding: 16px 24px 32px;
         max-width: 1400px; margin: 0 auto; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; padding: 12px; } }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted);
       display: flex; align-items: center; gap: 8px; }
  h2 .count { background: var(--chip); border-radius: 10px; padding: 0 8px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 0 8px 8px 0; }
  td { padding: 10px 8px 10px 0; border-top: 1px solid var(--line); vertical-align: top; }
  .name { font-weight: 600; } .role { color: var(--muted); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { background: var(--chip); border-radius: 6px; padding: 1px 7px; font-size: 12px; white-space: nowrap; }
  .bar { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; min-width: 90px; }
  .bar i { display: block; height: 100%; border-radius: 4px; }
  .load { font-size: 12px; color: var(--muted); margin-top: 3px; white-space: nowrap; }
  .tag { border-radius: 6px; padding: 1px 8px; font-size: 12px; white-space: nowrap; }
  .tag.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
  .tag.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
  .tag.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
  .finding { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); align-items: baseline; }
  .finding:first-of-type { border-top: 0; }
  .empty { color: var(--muted); }
  textarea { width: 100%; min-height: 72px; resize: vertical; background: var(--bg); border: 1px solid var(--line);
             border-radius: 8px; padding: 10px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  button { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  .examples button { font-size: 12px; padding: 3px 9px; color: var(--muted); }
  .answer { margin-top: 12px; padding: 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
  .answer ul { margin: 4px 0; padding-left: 20px; } .answer p { margin: 4px 0; }
  .answer pre { margin: 6px 0; overflow-x: auto; font-size: 12px; }
  .plan { margin-top: 12px; border: 1px solid var(--accent); border-radius: 8px; padding: 12px; }
  .plan h3 { margin: 0 0 8px; font-size: 14px; }
  .step { padding: 8px 0; border-top: 1px solid var(--line); }
  .step .why { color: var(--muted); font-size: 12px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .audit { max-height: 340px; overflow-y: auto; }
  .entry { display: grid; grid-template-columns: 58px 92px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line);
           font-size: 12px; }
  .modes { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .modes button { border: 0; border-radius: 0; padding: 3px 12px; font-size: 12px; }
  .modes button.on { background: var(--accent); color: #fff; }
  .sug { padding: 10px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
  .sug .why { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .sug button { font-size: 12px; padding: 4px 10px; }
  input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; flex: 1; min-width: 160px; }
  .member { padding: 8px 0; border-top: 1px solid var(--line); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .member .who2 { font-weight: 600; margin-right: 4px; }
  .chip.role { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .chip.base { color: var(--muted); }
  .chip button { border: 0; background: none; padding: 0 0 0 4px; color: inherit; cursor: pointer; }
  .member select, .roledef select { font-size: 12px; padding: 2px 6px; margin-left: auto; }
  .roledef { padding: 8px 0; border-top: 1px solid var(--line); }
  .roledef .head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .roledef .head b { margin-right: auto; }
  .roledef .head button { font-size: 12px; padding: 2px 8px; }
  .rights { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; margin: 8px 0; font-size: 12px; }
  .rights label { display: flex; gap: 6px; align-items: baseline; }
  .fbar { position: relative; height: 14px; background: var(--chip); border-radius: 7px; overflow: hidden; }
  .fbar i { position: absolute; top: 0; left: 0; height: 100%; }
  .fbar #fexp { background: var(--accent); opacity: .55; } .fbar #fdone { background: var(--ok); z-index: 1; }
  .fbar b { position: absolute; top: 6px; height: 2px; background: var(--ink); z-index: 2; }
  .flegend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .flegend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .flegend #fcommitted { margin-left: auto; }
  .entry .kind { font-weight: 600; } .entry .t { color: var(--muted); }
  .entry .d { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <h1>TeamLens</h1>
  <span class="src" id="src"></span>
  <label class="who">Working as <select id="actor"></select></label>
</header>
<main>
  <div>
    <section>
      <h2>Sprint forecast <span class="tag" id="risk"></span></h2>
      <div class="fbar"><i id="fdone"></i><i id="fexp"></i><b id="frange"></b></div>
      <div class="flegend"><span><i style="background:var(--ok)"></i>done</span><span><i style="background:var(--accent)"></i>expected by the end</span>
        <span><i style="background:var(--ink);height:2px"></i>90% interval</span><span id="fcommitted"></span></div>
      <div class="meta" id="fsummary"></div>
    </section>
    <section>
      <h2>Team <span class="count" id="today"></span></h2>
      <table>
        <thead><tr><th>Person</th><th>Open issues</th><th>Sprint load</th><th>Status</th></tr></thead>
        <tbody id="team"></tbody>
      </table>
    </section>
    <section>
      <h2>Problems found <span class="count" id="nfind">0</span></h2>
      <div id="findings"></div>
    </section>
    <section>
      <h2>Sprint work without an owner <span class="count" id="nunowned">0</span>
        <span class="modes" id="modes"><button data-mode="suggest">Suggest</button><button data-mode="auto">Auto</button></span>
      </h2>
      <div class="meta" id="modeinfo" style="margin:-4px 0 8px"></div>
      <div id="unowned"><div class="empty">Checking…</div></div>
      <div id="recent"></div>
      <div class="row"><input id="newsum" placeholder="New task for the team, added to the sprint"><select id="newpts">
        <option>1</option><option selected>2</option><option>3</option><option>5</option><option>8</option></select>
        <button id="newadd">Add to sprint</button></div>
      <div class="meta" id="newinfo"></div>
    </section>
    <section>
      <h2>Unassigned backlog <span class="count" id="nback">0</span></h2>
      <div class="chips" id="backlog"></div>
    </section>
  </div>
  <div>
    <section>
      <h2>Ask the agent</h2>
      <textarea id="text" placeholder="Ask about the team, or ask for a change in Jira"></textarea>
      <div class="row examples" id="examples"></div>
      <div class="row"><button class="primary" id="send">Send</button><span class="meta" id="busy"></span></div>
      <div id="result"></div>
    </section>
    <section>
      <h2>Audit log <span class="tag ok" id="chain"></span></h2>
      <div class="audit" id="audit"></div>
    </section>
    <section>
      <h2>Roles and rights</h2>
      <div class="meta" id="myrights" style="margin:-4px 0 10px"></div>
      <div id="members"></div>
      <h2 style="margin-top:16px">Roles of this team</h2>
      <div id="roles"></div>
      <div id="roleform"></div>
      <div class="meta" id="roleinfo"></div>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const api = async (path, body) => {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
};
const EXAMPLES = ["Who is at risk this sprint and why?", "Who has spare capacity?",
                  "Reassign the work of whoever is away to people with capacity."];
const KIND = {assigned_while_absent: ["away, owns work", "warn"], assigned_to_terminated: ["left, owns work", "bad"],
              overloaded: ["overloaded", "bad"], idle: ["no work", "warn"], stale_in_progress: ["stale", "warn"], unowned_in_sprint: ["no owner", "warn"]};
let thread = null, issues = {}, names = {};

function markdown(text) {
  const out = []; let list = false, pre = false;
  for (const raw of String(text).split("\n")) {
    const line = esc(raw).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
    const table = raw.trim().startsWith("|");
    if (pre && !table) { out.push("</pre>"); pre = false; }
    const item = raw.match(/^\s*(?:[-*]|\d+\.)\s+/);
    if (list && !item) { out.push("</ul>"); list = false; }
    if (table) { if (!pre) { out.push("<pre>"); pre = true; } out.push(esc(raw) + "\n"); }
    else if (item) { if (!list) { out.push("<ul>"); list = true; } out.push("<li>" + line.replace(/^\s*(?:[-*]|\d+\.)\s+/, "") + "</li>"); }
    else if (raw.trim()) out.push("<p>" + line.replace(/^#+\s*/, "") + "</p>");
  }
  if (list) out.push("</ul>"); if (pre) out.push("</pre>");
  return out.join("");
}

async function loadOverview() {
  const o = await api("/api/overview?actor=" + $("actor").value);
  issues = o.issues;
  names = Object.fromEntries(o.loads.map(x => [x.employee_id, x.name]));
  $("today").textContent = o.today;
  const f = o.forecast, pct = v => (f.committed ? Math.min(100, 100 * v / f.committed) : 0) + "%";
  $("risk").textContent = f.at_risk ? "at risk" : "on track"; $("risk").className = "tag " + (f.at_risk ? "bad" : "ok");
  $("fdone").style.width = pct(f.done); $("fexp").style.width = pct(f.expected);
  $("frange").style.left = pct(f.low); $("frange").style.width = pct(f.high - f.low);
  $("fcommitted").textContent = f.committed + " points committed";
  $("fsummary").textContent = f.summary;
  $("team").innerHTML = o.loads.map(x => {
    const av = x.availability, pct = x.load == null ? 0 : Math.round(x.load * 100);
    const color = pct > 150 ? "var(--bad)" : pct > 100 ? "var(--warn)" : "var(--ok)";
    const status = !av.active ? '<span class="tag bad">left the company</span>'
      : av.available_today ? '<span class="tag ok">at work</span>'
      : `<span class="tag warn">away until ${esc(av.unavailable_until)}</span>`;
    const chips = x.open_issues.map(k => `<span class="chip" title="${esc(issues[k]?.summary)} · ${esc(issues[k]?.status)}">${esc(k)}</span>`).join("");
    return `<tr><td><div class="name">${esc(x.name)}</div><div class="role">${esc(x.role)} · ${esc(x.employee_id)}</div></td>
      <td><div class="chips">${chips || '<span class="empty">none</span>'}</div></td>
      <td><div class="bar"><i style="width:${Math.min(pct, 100)}%;background:${color}"></i></div>
          <div class="load">${x.sprint_points} of ${x.capacity_points} pts${x.load == null ? "" : " · " + pct + "%"}</div></td>
      <td>${status}</td></tr>`;
  }).join("");
  $("nfind").textContent = o.findings.length;
  $("findings").innerHTML = o.findings.map(f => {
    const [label, tone] = KIND[f.kind] || [f.kind, "warn"];
    return `<div class="finding"><span class="tag ${tone}">${label}</span><span>${esc(f.detail)}</span></div>`;
  }).join("") || '<div class="empty">Nothing needs attention.</div>';
  $("nback").textContent = o.backlog.length;
  $("backlog").innerHTML = o.backlog.map(k => `<span class="chip" title="${esc(issues[k]?.summary)}">${esc(k)} · ${esc(issues[k]?.summary)}</span>`).join("")
    || '<span class="empty">Empty.</span>';
}

async function loadAudit() {
  const a = await api("/api/audit");
  $("chain").textContent = a.intact ? `chain intact · ${a.total} entries` : "CHAIN BROKEN";
  $("chain").className = "tag " + (a.intact ? "ok" : "bad");
  $("audit").innerHTML = a.entries.map(e => {
    const d = e.data, detail = e.kind === "request" ? d.text : e.kind === "plan_proposed" ? (d.refused.length ? "refused: " + d.refused.join("; ") : d.plan.summary)
      : e.kind === "approval" ? (d.approved ? "approved" : "rejected") : e.kind === "step" ? d.result
      : e.kind === "auto_assign" ? `${d.issue} → ${d.assignee || "nobody"}: ${d.reason}` : e.kind === "autoassign_mode" ? `mode ${d.mode}`
      : e.kind === "role_granted" ? `${d.role} → ${d.employee}` : e.kind === "role_revoked" ? `${d.role} taken from ${d.employee}`
      : e.kind === "role_defined" ? `${d.role}: ${d.rights.join(", ")}` : e.kind === "role_deleted" ? d.role
      : e.kind === "auto_assign_undone" ? `${d.issue} unassigned` : e.kind === "issue_created" ? `${d.issue} ${d.summary}` : d.outcome;
    return `<div class="entry"><span class="t">${esc(e.at.slice(11, 19))}</span><span class="kind">${esc(e.kind)}</span>
      <span class="d" title="${esc(detail)}">${esc(e.actor)} · ${esc(detail)}</span></div>`;
  }).join("") || '<div class="empty">No entries yet.</div>';
}

async function loadAuto() {
  const a = await api("/api/autoassign?actor=" + $("actor").value);
  for (const b of $("modes").children) { b.className = b.dataset.mode === a.mode ? "on" : ""; b.disabled = !a.can_configure; }
  $("modeinfo").textContent = a.mode === "auto"
    ? `Auto: new sprint work gets an owner without asking${a.set_by ? ", switched on by " + a.set_by : ""}. Every assignment is explained and can be undone.`
    : "Suggest: the system proposes an owner; a person confirms.";
  $("nunowned").textContent = a.suggestions.length;
  $("unowned").innerHTML = a.suggestions.map(s => `<div class="sug"><div><b>${esc(s.issue_key)}</b> · ${esc(s.summary)} · ${s.points} pts
        ${s.area ? `<span class="tag ${s.area_confidence >= 0.5 ? "ok" : "warn"}" title="Kind of work, by ${esc(a.triage)}">${esc(s.area)}${s.area_confidence < 1 ? " · " + Math.round(s.area_confidence * 100) + "%" : ""}</span>` : ""}</div>
      ${s.assignee_id && a.can_configure ? `<button class="primary" data-act="assign" data-key="${esc(s.issue_key)}">Assign to ${esc(s.assignee_name)}</button>` : "<span></span>"}
      <div class="why">${esc(s.reason)}</div></div>`).join("") || '<div class="empty">Every sprint issue has an owner.</div>';
  $("recent").innerHTML = a.recent.map(r => `<div class="sug"><div><span class="tag ok">${r.by_system ? "auto" : "confirmed"}</span> <b>${esc(r.issue_key)}</b> → ${esc(r.assignee_name)}</div>
      ${a.can_configure ? `<button data-act="undo" data-key="${esc(r.issue_key)}">Undo</button>` : "<span></span>"}
      <div class="why">${esc(r.reason)}</div></div>`).join("");
  $("newadd").disabled = !a.can_create;
}
async function loadRoles() {
  const r = await api("/api/roles?actor=" + $("actor").value);
  const canGive = r.mine.includes("roles.grant"), canDefine = r.mine.includes("roles.define");
  $("myrights").textContent = "You may: " + (r.mine.map(x => r.catalogue[x].toLowerCase()).join("; ") || "nothing in this team") + ".";
  $("members").innerHTML = r.members.map(m => {
    const giveable = r.roles.filter(x => x.can_give && x.name !== m.base && !m.granted.includes(x.name));
    return `<div class="member"><span class="who2">${esc(m.name)}</span>
      <span class="chip base" title="From the HR record; cannot be changed here">${esc(m.base)}</span>
      ${m.granted.map(g => `<span class="chip role">${esc(g)}${canGive ? `<button title="Take away" data-do="revoke" data-who="${esc(m.id)}" data-role="${esc(g)}">×</button>` : ""}</span>`).join("")}
      ${giveable.length ? `<select data-who="${esc(m.id)}"><option value="">+ give a role</option>${giveable.map(x => `<option>${esc(x.name)}</option>`).join("")}</select>` : ""}</div>`;
  }).join("");
  $("roles").innerHTML = r.roles.map(x => `<div class="roledef"><div class="head"><b>${esc(x.name)}</b>
      <span class="meta">${x.built_in ? "built in" : "this team's own"}</span>
      ${!x.built_in && canDefine ? `<button class="danger" data-do="delete" data-role="${esc(x.name)}">Delete</button>` : ""}</div>
      <div class="chips">${x.rights.map(k => `<span class="chip">${esc(r.catalogue[k])}</span>`).join("")}</div></div>`).join("");
  $("roleform").innerHTML = !canDefine ? "" : `<div class="roledef"><div class="head"><b>New role</b></div>
      <input id="rolename" placeholder="name, for example tech-lead">
      <div class="rights">${r.mine.map(k => `<label><input type="checkbox" value="${esc(k)}" style="flex:none;min-width:0"> ${esc(r.catalogue[k])}</label>`).join("")}</div>
      <button data-do="define">Create role</button></div>`;
}
async function roleAction(path, body) {
  $("roleinfo").textContent = "";
  try { await api("/api/roles/" + path, {actor: $("actor").value, ...body}); } catch (e) { $("roleinfo").textContent = e.message; }
  refresh();
}
const refresh = () => { loadOverview(); loadAuto(); loadAudit(); loadRoles(); };
async function act(what, issue_key) {
  try { const r = await api("/api/autoassign/" + what, {actor: $("actor").value, issue_key}); if (!r.ok) $("newinfo").textContent = r.detail; }
  catch (e) { $("newinfo").textContent = e.message; }
  refresh();
}
async function setMode(mode) {
  try { await api("/api/autoassign/mode", {actor: $("actor").value, mode}); } catch (e) { $("newinfo").textContent = e.message; }
  refresh();
}
async function addIssue() {
  const summary = $("newsum").value.trim(); if (!summary) return;
  try {
    const r = await api("/api/issues", {actor: $("actor").value, summary, points: +$("newpts").value});
    const done = r.applied.find(a => a.issue_key === r.issue_key);
    $("newinfo").textContent = `${r.issue_key} created.` + (done ? " " + done.detail : "");
    $("newsum").value = "";
  } catch (e) { $("newinfo").textContent = e.message; }
  refresh();
}

function describe(step) {
  if (step.tool === "assign_issue") return `Assign <b>${esc(step.issue_key)}</b> to <b>${esc(step.assignee_id ? (names[step.assignee_id] || step.assignee_id) : "nobody")}</b>`;
  if (step.tool === "transition_issue") return `Move <b>${esc(step.issue_key)}</b> to <b>${esc(step.status)}</b>`;
  return `Create issue <b>${esc(step.summary)}</b>`;
}

function show(r) {
  thread = r.thread;
  const meta = `<div class="meta">${esc(r.outcome)} · ${r.usage.calls} model calls · ${r.usage.tokens} tokens · $${r.usage.usd}</div>`;
  if (r.outcome === "needs_approval") {
    $("result").innerHTML = `<div class="plan"><h3>Plan: ${esc(r.plan.summary)}</h3>
      ${r.plan.steps.map((s, n) => `<div class="step">${n + 1}. ${describe(s)}<div class="why">${esc(s.reason)}</div></div>`).join("")}
      <div class="row"><button class="primary" onclick="decide(true)">Approve</button>
      <button class="danger" onclick="decide(false)">Reject</button>
      <span class="meta">Nothing changes in Jira until you approve.</span></div></div>${meta}`;
  } else {
    $("result").innerHTML = `<div class="answer">${markdown(r.answer)}</div>${meta}`;
  }
}

async function run(job) {
  $("send").disabled = true; $("busy").textContent = "working…";
  try { show(await job()); } catch (e) { $("result").innerHTML = `<div class="answer">${esc(e.message)}</div>`; }
  $("send").disabled = false; $("busy").textContent = "";
  refresh();
}
const send = () => $("text").value.trim() && run(() => api("/api/ask", {actor: $("actor").value, text: $("text").value.trim()}));
const decide = approved => run(() => api("/api/decide", {actor: $("actor").value, thread, approved}));

(async () => {
  const p = await api("/api/people");
  $("src").textContent = `team ${p.team} · ${p.source}`;
  $("actor").innerHTML = p.people.map(x => `<option value="${esc(x.id)}">${esc(x.name)} — ${esc(x.role)}</option>`).join("");
  $("examples").innerHTML = EXAMPLES.map(t => `<button>${esc(t)}</button>`).join("");
  $("examples").onclick = e => { if (e.target.tagName === "BUTTON") $("text").value = e.target.textContent; };
  $("actor").onchange = () => { $("result").innerHTML = ""; $("newinfo").textContent = ""; refresh(); };
  $("modes").onclick = e => { if (e.target.dataset.mode) setMode(e.target.dataset.mode); };
  $("newadd").onclick = addIssue;
  $("members").onchange = e => { if (e.target.tagName === "SELECT" && e.target.value) roleAction("grant", {employee_id: e.target.dataset.who, role: e.target.value}); };
  for (const id of ["members", "roles", "roleform"]) $(id).onclick = e => {
    const d = e.target.dataset;
    if (d.do === "revoke") roleAction("revoke", {employee_id: d.who, role: d.role});
    if (d.do === "delete") roleAction("delete", {name: d.role});
    if (d.do === "define") roleAction("define", {name: $("rolename").value, rights: [...document.querySelectorAll("#roleform input:checked")].map(x => x.value)});
  };
  for (const id of ["unowned", "recent"]) $(id).onclick = e => { if (e.target.dataset.act) act(e.target.dataset.act, e.target.dataset.key); };
  $("send").onclick = send;
  $("text").onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) send(); };
  refresh();
})();
</script>
</body>
</html>
